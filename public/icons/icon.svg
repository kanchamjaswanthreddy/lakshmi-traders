<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Rounded rectangle frame -->
  <rect width="512" height="512" rx="108" fill="#FFFFFF"/>
  <rect x="4" y="4" width="504" height="504" rx="104" fill="none" stroke="#1D1D1F" stroke-width="3"/>

  <!-- Price tag icon - Lucide style -->
  <g transform="translate(256, 230)" fill="none" stroke="#1D1D1F" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <!-- Tag body -->
    <path d="M-80,-100 L20,-100 L100,-20 L0,80 L-100,-20 Z"/>
    <!-- Tag hole -->
    <circle cx="-20" cy="-40" r="14" fill="none"/>
    <!-- Price lines -->
    <line x1="-30" y1="10" x2="30" y2="10"/>
    <line x1="-20" y1="35" x2="20" y2="35"/>
  </g>

  <!-- Monogram -->
  <text x="256" y="430" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="72" fill="#1D1D1F">LT</text>
</svg>
